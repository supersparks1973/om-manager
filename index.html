<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>O&M Manager · Man Projects</title>
<link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32.png">
<link rel="icon" type="image/svg+xml" href="./icons/icon.svg">
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#0F766E">
<meta name="apple-mobile-web-app-title" content="O&amp;M Manager">
<!-- PDF libraries (only needed when you Export). App works fully without them. -->
<script src="https://unpkg.com/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<script>if(typeof window.jspdf==='undefined'){document.write('<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"><\/script>');}</script>
<script src="https://unpkg.com/jspdf-autotable@3.8.2/dist/jspdf.plugin.autotable.min.js"></script>
<script>if(typeof window.jspdf!=='undefined'&&typeof window.jspdf.jsPDF.prototype.autoTable==='undefined'){document.write('<script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.2/dist/jspdf.plugin.autotable.min.js"><\/script>');}</script>
<script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
<script>if(typeof window.PDFLib==='undefined'){document.write('<script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"><\/script>');}</script>

<!-- One-time data migration bundle (optional sidecar; safe to delete after first run) -->
<script src="om-seed-data.js" onerror="window.OM_SEED=window.OM_SEED||null"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --navy:#0f2740; --navy-2:#163450; --ink:#1e293b; --muted:#64748b; --line:#e6eaf0;
  --bg:#f4f6f9; --card:#ffffff; --amber:#f59e0b; --amber-d:#d97706;
  --green:#10b981; --red:#ef4444; --blue:#2563eb;
  --r:12px; --sh:0 1px 2px rgba(15,39,64,.06),0 4px 16px rgba(15,39,64,.06);
}
html{font-size:15px}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;-webkit-font-smoothing:antialiased}
.app{display:flex;min-height:100vh}
/* Sidebar */
.side{width:248px;background:linear-gradient(180deg,var(--navy),var(--navy-2));color:#fff;position:fixed;inset:0 auto 0 0;display:flex;flex-direction:column;z-index:40}
.brand{padding:20px 20px 16px;border-bottom:1px solid rgba(255,255,255,.08)}
.brand .mark{display:flex;align-items:center;gap:10px}
.brand .logo{width:34px;height:34px;border-radius:9px;background:var(--amber);color:var(--navy);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:1.05rem}
.brand h1{font-size:1.02rem;font-weight:700;line-height:1.1}
.brand p{font-size:.7rem;color:rgba(255,255,255,.55);margin-top:2px}
.nav{flex:1;overflow-y:auto;padding:12px 12px}
.nav .lbl{font-size:.62rem;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.4);padding:14px 10px 6px}
.nav a{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:9px;color:rgba(255,255,255,.82);font-size:.9rem;cursor:pointer;transition:.15s;user-select:none}
.nav a:hover{background:rgba(255,255,255,.07);color:#fff}
.nav a.on{background:rgba(255,255,255,.12);color:#fff}
.nav a .ic{width:18px;text-align:center}
.nav a .bdg{margin-left:auto;background:var(--amber);color:var(--navy);font-size:.68rem;font-weight:700;padding:1px 7px;border-radius:9px}
.side .foot{padding:12px 18px;border-top:1px solid rgba(255,255,255,.08);font-size:.68rem;color:rgba(255,255,255,.5);line-height:1.5}
/* Main */
.main{flex:1;margin-left:248px;min-width:0}
.top{position:sticky;top:0;z-index:30;background:rgba(244,246,249,.85);backdrop-filter:saturate(1.4) blur(8px);border-bottom:1px solid var(--line);padding:12px 28px;display:flex;align-items:center;gap:14px}
.top .crumb{font-size:.92rem;color:var(--muted)}
.top .crumb b{color:var(--ink)}
.top .sp{flex:1}
.top .proj-pill{font-size:.82rem;color:var(--navy);background:#eaf0f8;border:1px solid #dbe4f0;padding:6px 12px;border-radius:20px;font-weight:600}
.wrap{padding:28px;max-width:1180px}
.menu-btn{display:none;background:none;border:0;font-size:1.3rem;cursor:pointer}
/* Typography helpers */
.h-pg{font-size:1.5rem;font-weight:750;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:.9rem;margin-top:3px}
.row{display:flex;align-items:center;gap:12px}
.between{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
/* Cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
.card-h{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:10px}
.card-h h2{font-size:1rem;font-weight:700}
.card-b{padding:18px}
.grid{display:grid;gap:18px}
.g-auto{grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.g-4{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
/* Buttons */
.btn{display:inline-flex;align-items:center;gap:7px;padding:9px 15px;border:1px solid transparent;border-radius:10px;font-size:.86rem;font-weight:600;cursor:pointer;transition:.15s;line-height:1;white-space:nowrap}
.btn:active{transform:translateY(1px)}
.btn-p{background:var(--navy);color:#fff}.btn-p:hover{background:var(--navy-2)}
.btn-a{background:var(--amber);color:#3b2b06}.btn-a:hover{background:var(--amber-d);color:#fff}
.btn-o{background:#fff;border-color:var(--line);color:var(--ink)}.btn-o:hover{border-color:#c7d2e0;background:#fafbfd}
.btn-d{background:#fff;border-color:#f3c9c9;color:var(--red)}.btn-d:hover{background:#fef2f2}
.btn-sm{padding:6px 10px;font-size:.78rem;border-radius:8px}
.btn-lg{padding:13px 22px;font-size:.95rem}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.iconbtn{background:none;border:0;cursor:pointer;padding:6px;border-radius:8px;font-size:.95rem;color:var(--muted)}
.iconbtn:hover{background:#f1f5f9;color:var(--ink)}
/* Stats */
.stat{display:flex;align-items:center;gap:14px;padding:18px}
.stat .ico{width:46px;height:46px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:1.3rem;background:#eef2f8}
.stat h3{font-size:1.5rem;font-weight:750;line-height:1}
.stat p{font-size:.8rem;color:var(--muted);margin-top:4px}
/* Progress */
.pbar{height:8px;background:#e9eef5;border-radius:6px;overflow:hidden}
.pbar>i{display:block;height:100%;border-radius:6px;background:var(--green);transition:width .4s}
.pbar>i.am{background:var(--amber)} .pbar>i.rd{background:var(--red)}
/* Project cards */
.pcard{cursor:pointer;transition:.18s}
.pcard:hover{box-shadow:0 8px 26px rgba(15,39,64,.12);transform:translateY(-2px)}
.pcard .t{font-weight:700}
.pcard .c{font-size:.82rem;color:var(--muted);margin:2px 0 12px}
/* Tabs */
.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);margin-bottom:18px;padding-bottom:1px}
.tab{padding:9px 14px;font-size:.85rem;font-weight:600;color:var(--muted);border:0;background:none;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;display:flex;align-items:center;gap:6px}
.tab:hover{color:var(--ink)}
.tab.on{color:var(--navy);border-bottom-color:var(--amber)}
.tab .pill{font-size:.68rem;background:#eef2f8;color:var(--muted);border-radius:9px;padding:1px 7px}
.tab.on .pill{background:#fde9c8;color:var(--amber-d)}
/* Checklist */
.ck{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px;cursor:pointer;transition:.15s}
.ck:hover{border-color:#cbd6e6;background:#fafbfe}
.ck .dot{width:22px;height:22px;border-radius:50%;border:2px solid #d6deea;display:flex;align-items:center;justify-content:center;font-size:.75rem;flex-shrink:0;color:#fff}
.ck.done .dot{background:var(--green);border-color:var(--green)}
.ck .nm{flex:1;font-size:.9rem;font-weight:600}
.ck .meta{font-size:.74rem;color:var(--muted);font-weight:500}
.tag{font-size:.62rem;font-weight:700;letter-spacing:.04em;padding:2px 7px;border-radius:6px}
.tag.req{background:#fde9e9;color:#b42318} .tag.opt{background:#e8eefb;color:#2747a8}
/* Upload */
.uz{border:2px dashed #cdd8e6;border-radius:12px;padding:26px;text-align:center;cursor:pointer;background:#fafcff;transition:.18s}
.uz:hover,.uz.drag{border-color:var(--amber);background:#fff8ec}
.uz .ic{font-size:2rem}
.uz p{color:var(--muted);font-size:.85rem;margin-top:6px}
.uz .br{color:var(--navy);font-weight:700;text-decoration:underline}
.file{display:flex;align-items:center;gap:12px;padding:11px 13px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px;background:#fff}
.file .fi{font-size:1.4rem}
.file .nm{font-size:.86rem;font-weight:600;word-break:break-word}
.file .mt{font-size:.74rem;color:var(--muted);margin-top:2px}
.file .ac{margin-left:auto;display:flex;gap:2px;flex-shrink:0}
/* Forms */
.fg{margin-bottom:14px}
.fg label{display:block;font-size:.82rem;font-weight:600;margin-bottom:5px}
.fg input,.fg select,.fg textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;font:inherit;font-size:.9rem;background:#fff}
.fg input:focus,.fg select:focus,.fg textarea:focus{outline:none;border-color:var(--navy);box-shadow:0 0 0 3px rgba(15,39,64,.08)}
.frow{display:flex;gap:14px}.frow .fg{flex:1}
/* Editor */
.ed-wrap{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}
.ed-tb{display:flex;flex-wrap:wrap;gap:3px;padding:6px;background:#f7f9fc;border-bottom:1px solid var(--line)}
.ed-tb button{background:#fff;border:1px solid var(--line);border-radius:7px;min-width:30px;height:30px;cursor:pointer;font-size:.85rem;color:var(--ink)}
.ed-tb button:hover{background:#eef4ff;border-color:#c3d2e8}
.ed-tb .sep{width:1px;background:var(--line);margin:2px 3px}
.ed{min-height:150px;max-height:440px;overflow-y:auto;padding:14px 16px;font-size:.92rem;line-height:1.55;outline:none}
.ed:empty:before{content:attr(data-ph);color:#aab4c2}
.ed h2{font-size:1.15rem;margin:10px 0 6px}.ed h3{font-size:1rem;margin:8px 0 4px}
.ed ul,.ed ol{margin:6px 0 8px 22px}.ed p{margin:0 0 8px}
.ed table{border-collapse:collapse;margin:8px 0;font-size:.85rem}.ed td,.ed th{border:1px solid var(--line);padding:5px 8px}
.savehint{font-size:.72rem;color:var(--muted)}
/* Modal */
.ov{position:fixed;inset:0;background:rgba(15,23,42,.5);display:flex;align-items:center;justify-content:center;z-index:80;opacity:0;pointer-events:none;transition:.18s;padding:20px}
.ov.on{opacity:1;pointer-events:auto}
.modal{background:#fff;border-radius:16px;width:100%;max-width:560px;max-height:90vh;overflow-y:auto;box-shadow:0 24px 60px rgba(15,39,64,.3)}
.modal-h{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.modal-h h2{font-size:1.05rem}
.modal-b{padding:20px}
.modal-f{padding:14px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.x{background:none;border:0;font-size:1.4rem;cursor:pointer;color:var(--muted);line-height:1}
/* Preview */
.pv{display:none;position:fixed;inset:0;z-index:90;background:rgba(8,15,26,.9);flex-direction:column}
.pv.on{display:flex}
.pv-h{background:var(--navy);color:#fff;padding:11px 16px;display:flex;align-items:center;gap:12px}
.pv-h .ti{flex:1;font-weight:600;font-size:.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pv-b{flex:1;display:flex;align-items:center;justify-content:center;overflow:auto;background:#222}
.pv-b iframe{width:100%;height:100%;border:0;background:#fff}
.pv-b img{max-width:100%;max-height:100%;object-fit:contain}
.pv-b .docpage{align-self:flex-start;background:#fff;color:#1e293b;width:min(820px,94%);margin:24px auto;padding:44px 52px;border-radius:6px;box-shadow:0 6px 30px rgba(0,0,0,.45);font-family:Calibri,'Segoe UI',system-ui,sans-serif;line-height:1.55}
.pv-b .docpage h1{font-size:1.6rem}.pv-b .docpage h2{font-size:1.3rem}.pv-b .docpage h3{font-size:1.1rem}
.pv-b .docpage h1,.pv-b .docpage h2,.pv-b .docpage h3,.pv-b .docpage h4{margin:.9em 0 .35em;color:#0f2740;line-height:1.25}
.pv-b .docpage p{margin:.5em 0}
.pv-b .docpage ul,.pv-b .docpage ol{margin:.5em 0 .5em 1.5em}
.pv-b .docpage table{border-collapse:collapse;margin:14px 0;width:100%;font-size:.95em}
.pv-b .docpage td,.pv-b .docpage th{border:1px solid #cbd5e1;padding:6px 10px;vertical-align:top}
.pv-b .docpage img{max-width:100%;height:auto}
.pv-b .docpage a{color:#2563eb}
.pv-msg{color:#fff;text-align:center;padding:40px;font-size:.95rem;max-width:520px;margin:auto}
/* Toast */
.toasts{position:fixed;bottom:22px;right:22px;z-index:200;display:flex;flex-direction:column;gap:8px}
.toast{padding:11px 16px;border-radius:10px;color:#fff;font-size:.85rem;box-shadow:var(--sh);animation:sl .25s}
.toast.s{background:var(--green)}.toast.e{background:var(--red)}.toast.i{background:var(--navy)}
@keyframes sl{from{transform:translateX(20px);opacity:0}to{transform:none;opacity:1}}
.empty{text-align:center;padding:48px 20px;color:var(--muted)}
.empty .ic{font-size:2.6rem;margin-bottom:10px}
.empty h3{color:var(--ink);font-size:1.05rem;margin-bottom:5px}
.empty p{font-size:.86rem;margin-bottom:14px}
table.tbl{width:100%;border-collapse:collapse;font-size:.85rem}
.tbl th,.tbl td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line)}
.tbl th{font-size:.7rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);background:#f8fafc}
.note{font-size:.78rem;color:var(--muted)}
@media(max-width:820px){
 .side{transform:translateX(-248px);transition:.25s}.side.open{transform:none}
 .main{margin-left:0}.menu-btn{display:block}.frow{flex-direction:column;gap:0}
}
</style>
</head>
<body>
<div class="app">
  <aside class="side" id="side">
    <div class="brand">
      <div style="background:#fff;border-radius:10px;padding:9px 12px;display:flex;align-items:center;justify-content:center">
        <img id="brandLogo" alt="Man Projects Ltd" style="width:100%;max-width:184px;height:auto;display:block">
      </div>
      <p style="margin-top:9px;font-size:.74rem;color:rgba(255,255,255,.62);text-align:center;letter-spacing:.02em">O&amp;M Manual Manager</p>
    </div>
    <nav class="nav" id="nav">
      <div class="lbl">Workspace</div>
      <a data-pg="projects" onclick="go('projects')"><span class="ic">📁</span> Projects <span class="bdg" id="pcount">0</span></a>
      <div class="lbl">Current Project</div>
      <a data-pg="overview" onclick="go('overview')"><span class="ic">📋</span> Overview</a>
      <a data-pg="documents" onclick="go('documents')"><span class="ic">📄</span> Documents</a>
      <a data-pg="export" onclick="go('export')"><span class="ic">📕</span> Export PDF</a>
      <div class="lbl">App</div>
      <a data-pg="backup" onclick="go('backup')"><span class="ic">💾</span> Backup &amp; Storage</a>
      <a data-pg="about" onclick="go('about')"><span class="ic">ℹ️</span> About</a>
    </nav>
    <div class="foot"><span id="ver"></span><br>Local · stored on this Mac</div>
  </aside>
  <div class="main">
    <header class="top">
      <button class="menu-btn" onclick="document.getElementById('side').classList.toggle('open')">☰</button>
      <div class="crumb" id="crumb">Projects</div>
      <div class="sp"></div>
      <div class="proj-pill" id="projpill" style="display:none"></div>
    </header>
    <div class="wrap" id="view"></div>
  </div>
</div>

<div class="ov" id="ov" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <div class="modal-h"><h2 id="mTitle">Modal</h2><button class="x" onclick="closeModal()">&times;</button></div>
    <div class="modal-b" id="mBody"></div>
    <div class="modal-f" id="mFoot"></div>
  </div>
</div>
<div class="pv" id="pv">
  <div class="pv-h"><div class="ti" id="pvTitle">Preview</div>
    <button class="btn btn-sm btn-a" id="pvDl">⬇ Download</button>
    <button class="btn btn-sm btn-d" onclick="closePv()">Close</button></div>
  <div class="pv-b" id="pvBody"></div>
</div>
<div class="toasts" id="toasts"></div>

<script>
"use strict";

/* ───────── IndexedDB layer ───────── */
const DB_NAME='om_manager_v3', DB_VER=1;
let _db=null;
function openDB(){return new Promise((res,rej)=>{
 const r=indexedDB.open(DB_NAME,DB_VER);
 r.onupgradeneeded=()=>{const db=r.result;
  if(!db.objectStoreNames.contains('projects'))db.createObjectStore('projects',{keyPath:'id'});
  if(!db.objectStoreNames.contains('files'))db.createObjectStore('files',{keyPath:'fileId'});
  if(!db.objectStoreNames.contains('meta'))db.createObjectStore('meta',{keyPath:'key'});
 };
 r.onsuccess=()=>{_db=r.result;res(_db)};
 r.onerror=()=>rej(r.error);
});}
function _os(store,mode){return _db.transaction(store,mode).objectStore(store);}
function idbPut(store,val){return new Promise((res,rej)=>{const q=_os(store,'readwrite').put(val);q.onsuccess=()=>res(val);q.onerror=()=>rej(q.error);});}
function idbGet(store,key){return new Promise((res,rej)=>{const q=_os(store,'readonly').get(key);q.onsuccess=()=>res(q.result||null);q.onerror=()=>rej(q.error);});}
function idbAll(store){return new Promise((res,rej)=>{const q=_os(store,'readonly').getAll();q.onsuccess=()=>res(q.result||[]);q.onerror=()=>rej(q.error);});}
function idbDel(store,key){return new Promise((res,rej)=>{const q=_os(store,'readwrite').delete(key);q.onsuccess=()=>res();q.onerror=()=>rej(q.error);});}
async function metaSet(key,value){return idbPut('meta',{key,value});}
async function metaGet(key){const r=await idbGet('meta',key);return r?r.value:null;}

/* ───────── State ───────── */
let projects=[];
let currentProjectId=null;
let currentPage='projects';

function genId(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8);}
function currentProject(){return projects.find(p=>p.id===currentProjectId)||null;}
async function saveProject(p){p.updatedAt=new Date().toISOString();await idbPut('projects',p);const i=projects.findIndex(x=>x.id===p.id);if(i>=0)projects[i]=p;else projects.push(p);}

function newProjectObj(d){return{
 id:genId(),name:d.name,client:d.client||'',reference:d.reference||'',address:d.address||'',
 contractor:d.contractor||'',startDate:d.startDate||'',handoverDate:d.handoverDate||'',description:d.description||'',
 createdAt:new Date().toISOString(),updatedAt:new Date().toISOString(),
 sections:DEFAULT_SECTIONS.map(s=>({...s,text:'',documents:[]})),
};}

/* ───────── Helpers ───────── */
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}
function fmtDate(iso){if(!iso)return '—';const d=new Date(iso);return isNaN(d)?'—':d.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});}
function fmtSize(b){b=+b||0;if(b<1024)return b+' B';if(b<1048576)return (b/1024).toFixed(1)+' KB';return (b/1048576).toFixed(1)+' MB';}
function fileIcon(n){const e=(n||'').split('.').pop().toLowerCase();return ({pdf:'📕',doc:'📘',docx:'📘',xls:'📗',xlsx:'📗',csv:'📗',dwg:'📐',dxf:'📐',jpg:'🖼️',jpeg:'🖼️',png:'🖼️',gif:'🖼️',zip:'📦'})[e]||'📄';}
function sectionHasText(s){return !!(s&&typeof s.text==='string'&&s.text.replace(/<[^>]+>/g,'').replace(/&nbsp;/gi,' ').trim().length>0);}
function sectionDone(s){return !!s&&((s.documents&&s.documents.length>0)||sectionHasText(s));}
function progress(p){if(!p)return 0;const req=p.sections.filter(s=>s.required);if(!req.length)return 100;return Math.round(req.filter(sectionDone).length/req.length*100);}
function totalDocs(p){return p?p.sections.reduce((a,s)=>a+s.documents.length,0):0;}
function toast(m,t){const e=document.createElement('div');e.className='toast '+(t||'s');e.textContent=m;document.getElementById('toasts').appendChild(e);setTimeout(()=>e.remove(),3400);}
function openModal(title,body,foot){document.getElementById('mTitle').textContent=title;document.getElementById('mBody').innerHTML=body;document.getElementById('mFoot').innerHTML=foot||'';document.getElementById('ov').classList.add('on');}
function closeModal(){document.getElementById('ov').classList.remove('on');}

/* ───────── Navigation ───────── */
function go(pg){currentPage=pg;document.querySelectorAll('#nav a').forEach(a=>a.classList.toggle('on',a.dataset.pg===pg));document.getElementById('side').classList.remove('open');render();}
function render(){
 const p=currentProject();
 document.getElementById('pcount').textContent=projects.length;
 const pill=document.getElementById('projpill');
 if(p){pill.style.display='';pill.textContent=p.name;}else{pill.style.display='none';}
 const crumbs={projects:'Projects',overview:'Overview',documents:'Documents',export:'Export PDF',backup:'Backup & Storage',about:'About'};
 document.getElementById('crumb').innerHTML=(['overview','documents','export'].includes(currentPage)&&p)?(esc(p.name)+' › <b>'+crumbs[currentPage]+'</b>'):('<b>'+(crumbs[currentPage]||'')+'</b>');
 const v=document.getElementById('view');
 const needsProj=['overview','documents','export'].includes(currentPage);
 if(needsProj&&!p){v.innerHTML=noProj();return;}
 ({projects:renderProjects,overview:renderOverview,documents:renderDocuments,export:renderExport,backup:renderBackup,about:renderAbout}[currentPage]||renderProjects)(v);
}
function noProj(){return '<div class="empty"><div class="ic">📁</div><h3>No project selected</h3><p>Pick a project, or create a new one.</p><button class="btn btn-a btn-lg" onclick="go(\'projects\')">Go to Projects</button></div>';}

/* ───────── Projects ───────── */
function renderProjects(v){
 v.innerHTML=`
  <div class="between" style="margin-bottom:20px">
   <div><div class="h-pg">Projects</div><div class="sub">${projects.length} project${projects.length===1?'':'s'} · stored locally on this Mac</div></div>
   <button class="btn btn-a btn-lg" onclick="newProjectModal()">+ New Project</button>
  </div>
  ${projects.length===0?`<div class="card"><div class="empty"><div class="ic">📋</div><h3>No projects yet</h3><p>Create your first O&amp;M manual to get started.</p><button class="btn btn-p btn-lg" onclick="newProjectModal()">+ Create Project</button></div></div>`:`
  <div class="grid g-auto">
   ${projects.slice().sort((a,b)=>(b.updatedAt||'').localeCompare(a.updatedAt||'')).map(p=>{const pr=progress(p);const cls=pr>=75?'':pr>=40?'am':'rd';return `
    <div class="card pcard" onclick="selectProject('${p.id}')">
     <div class="card-b">
      <div class="t">${esc(p.name)}</div>
      <div class="c">${esc(p.client||'No client')}${p.reference?' · '+esc(p.reference):''}</div>
      <div style="display:flex;justify-content:space-between;font-size:.78rem;color:var(--muted);margin-bottom:5px"><span>Completion</span><span>${pr}%</span></div>
      <div class="pbar"><i class="${cls}" style="width:${pr}%"></i></div>
      <div style="display:flex;justify-content:space-between;align-items:center;margin-top:12px">
       <span class="note">${totalDocs(p)} file(s)</span>
       <button class="iconbtn" title="Delete" onclick="event.stopPropagation();confirmDeleteProject('${p.id}')">🗑️</button>
      </div>
     </div>
    </div>`;}).join('')}
  </div>`}`;
}

 openModal('New Project',`

async function addFiles(list,id){

 let n=0;
 for(const f of list){
  const fileId=genId();const now=new Date().toISOString();

   await idbPut('files',{fileId,projectId:p.id,sectionId:id,name:f.name,type:f.type||'',size:f.size,blob:f,uploadedAt:now,notes:''});
   s.documents.push({fileId,name:f.name,size:f.size,type:f.type||'',uploadedAt:now,notes:''});n++;
  }catch(err){console.error(err);toast('Could not store '+f.name+': '+(err.message||err),'e');}
 }

async function previewFile(fileId){
 const rec=await idbGet('files',fileId);if(!rec){toast('File not found','e');return;}
 const url=URL.createObjectURL(rec.blob);const name=(rec.name||'').toLowerCase();const type=(rec.type||'').toLowerCase();
 document.getElementById('pvTitle').textContent=rec.name||'Preview';
 const body=document.getElementById('pvBody');body.innerHTML='';
 const isImg=type.startsWith('image/')||/\.(png|jpe?g|gif|webp|bmp|svg)$/.test(name);
 const isPdf=type==='application/pdf'||name.endsWith('.pdf');
 const isDocx=type.includes('officedocument.wordprocessingml')||name.endsWith('.docx');
 const isDoc=name.endsWith('.doc')&&!isDocx;
 if(isPdf){const f=document.createElement('iframe');f.src=url;body.appendChild(f);}
 else if(isImg){const im=document.createElement('img');im.src=url;body.appendChild(im);}
 else if(isDocx){
  body.innerHTML='<div class="pv-msg">Rendering Word document…</div>';
  try{
   if(!window.mammoth)throw new Error('preview engine still loading — try again in a moment');
   const buf=await rec.blob.arrayBuffer();
   const res=await window.mammoth.convertToHtml({arrayBuffer:buf});
   const page=document.createElement('div');page.className='docpage';
   page.innerHTML=(res.value&&res.value.trim())?res.value:'<p style="color:#888">(This document has no readable text.)</p>';
   body.innerHTML='';body.appendChild(page);
  }catch(err){body.innerHTML='<div class="pv-msg"><div style="font-size:3rem">📘</div><p>Couldn\'t render this Word file'+(err&&err.message?' — '+err.message:'')+'.<br>Use Download to open it in Word.</p></div>';}
 }
 else if(isDoc){body.innerHTML='<div class="pv-msg"><div style="font-size:3rem">📘</div><p>Legacy <b>.doc</b> files can\'t be previewed in the browser.<br>Save it as <b>.docx</b>, or use Download to open it in Word.</p></div>';}
 else{body.innerHTML='<div class="pv-msg"><div style="font-size:3rem">📄</div><p>No in-browser preview for this type.<br>Use Download to open it.</p></div>';}
 document.getElementById('pvDl').onclick=()=>{const a=document.createElement('a');a.href=url;a.download=rec.name||'file';a.click();};
 document.getElementById('pv').classList.add('on');
 document.getElementById('pv')._url=url;
}

  <div class="card" style="border-left:4px solid var(--amber)"><div class="card-h"><h2>📥 Restore from backup</h2></div><div class="card-b">

   <button class="btn btn-o btn-lg" onclick="document.getElementById('impFile').click()">⬆ Choose backup file…</button>
   <input type="file" id="impFile" accept=".json,application/json" hidden onchange="importBackup(event)">
  </div></div>`;

async function exportBackup(){
 toast('Preparing backup…','i');
 const files=await idbAll('files');
 const fileOut=[];
 for(const f of files){const b64=await blobToB64(f.blob);fileOut.push({fileId:f.fileId,projectId:f.projectId,sectionId:f.sectionId,name:f.name,type:f.type,size:f.size,uploadedAt:f.uploadedAt,notes:f.notes,b64});}
 const out={app:'om-manager',version:3,exportedAt:new Date().toISOString(),projects,files:fileOut};
 const blob=new Blob([JSON.stringify(out)],{type:'application/json'});const url=URL.createObjectURL(blob);
 const ts=new Date().toISOString().replace(/[:.]/g,'-').slice(0,19);
 const a=document.createElement('a');a.href=url;a.download='om-backup-'+ts+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),4000);
 toast('Backup downloaded');
}
function importBackup(e){const file=e.target.files&&e.target.files[0];if(!file)return;
 const r=new FileReader();
 r.onload=async()=>{try{
   const d=JSON.parse(r.result);if(!d||!Array.isArray(d.projects))throw new Error('Not a valid backup');
   for(const inP of d.projects){
    const exist=projects.find(p=>(p.reference&&inP.reference&&p.reference.toLowerCase()===inP.reference.toLowerCase())||p.name.toLowerCase()===inP.name.toLowerCase());
    if(exist){inP.id=exist.id;} // overwrite matching
    await idbPut('projects',inP);
   }
   if(Array.isArray(d.files)){for(const f of d.files){const blob=b64ToBlob(f.b64,f.type||'application/octet-stream');await idbPut('files',{fileId:f.fileId,projectId:f.projectId,sectionId:f.sectionId,name:f.name,type:f.type,size:f.size,uploadedAt:f.uploadedAt,notes:f.notes,blob});}}
   projects=await idbAll('projects');currentProjectId=projects[0]?projects[0].id:null;await metaSet('currentProjectId',currentProjectId);

async function exportPdf(mode){

 if(typeof window.jspdf==='undefined'||!window.jspdf.jsPDF){toast('PDF engine not loaded — connect to the internet and refresh, then try again.','e');return;}

 const st=document.getElementById('pdfStatus');const dl=document.getElementById('dlBtn');const pb=document.getElementById('pvBtn');

// Deliver a finished PDF blob URL either to the preview tab (with overlay fallback) or as a download.

async function rasterizePdf(bytes){

  const page=await pdf.getPage(i);const vp=page.getViewport({scale:1.6});

 const stt={fs:10,bold:false,italic:false,underline:false,color:o.DARK.slice(),indent:0,align:'left'};
 function style(b,i){return b&&i?'bolditalic':b?'bold':i?'italic':'normal';}
 function flush(){if(!runs.length)return;const lh=lineFs*0.5;if(y+lh>o.pageBottom){o.newPage();y=o.topY;}let cx=x+stt.indent;for(const r of runs){doc.setFont('helvetica',style(r.b,r.i));doc.setFontSize(r.fs);doc.setTextColor(...r.c);doc.text(r.t,cx,y+lh*0.8);if(r.u){doc.setDrawColor(...r.c);doc.setLineWidth(.2);doc.line(cx,y+lh*0.8+.6,cx+r.w,y+lh*0.8+.6);}cx+=r.w;}y+=lh+1.5;runs=[];lineFs=stt.fs;}
 function addText(t){const toks=t.replace(/\s+/g,' ').split(/(\s+)/).filter(x=>x.length);for(const tk of toks){doc.setFont('helvetica',style(stt.bold,stt.italic));doc.setFontSize(stt.fs);const w=doc.getTextWidth(tk);const avail=maxW-stt.indent;let lw=0;for(const r of runs)lw+=r.w;if(lw+w>avail&&runs.length){if(/^\s+$/.test(tk)){flush();continue;}flush();}if(!runs.length&&/^\s+$/.test(tk))continue;runs.push({t:tk,fs:stt.fs,b:stt.bold,i:stt.italic,u:stt.underline,c:stt.color.slice(),w});if(stt.fs>lineFs)lineFs=stt.fs;}}
 let olCount=[];
 function walk(n){
  if(n.nodeType===3){addText(n.nodeValue);return;}
  if(n.nodeType!==1)return;
  const tag=n.tagName.toUpperCase();const sv={...stt,color:stt.color.slice()};
  const block=['P','DIV','H1','H2','H3','H4','UL','OL','LI','TR','BR','TABLE'].includes(tag);
  if(block&&runs.length)flush();
  if(tag==='H1'){stt.fs=16;stt.bold=true;y+=3;}else if(tag==='H2'){stt.fs=14;stt.bold=true;y+=3;}else if(tag==='H3'){stt.fs=11.5;stt.bold=true;y+=2;}
  else if(tag==='B'||tag==='STRONG')stt.bold=true;else if(tag==='I'||tag==='EM')stt.italic=true;else if(tag==='U')stt.underline=true;
  else if(tag==='A'){stt.color=[37,99,175];stt.underline=true;}
  else if(tag==='UL'){olCount.push(null);stt.indent+=6;}else if(tag==='OL'){olCount.push(0);stt.indent+=6;}
  if(tag==='LI'){const top=olCount[olCount.length-1];let mk='•  ';if(top!==null&&top!==undefined){olCount[olCount.length-1]=top+1;mk=(top+1)+'.  ';}addText(mk);}
  if(tag==='TD'||tag==='TH'){addText(' '); }
  for(const c of n.childNodes)walk(c);
  if(block&&runs.length)flush();
  if(['P','H1','H2','H3','LI','TR'].includes(tag))y+=tag==='LI'?1.5:3;
  if(tag==='UL'||tag==='OL')olCount.pop();
  if(tag==='BR')flush();
  Object.assign(stt,{fs:sv.fs,bold:sv.bold,italic:sv.italic,underline:sv.underline,color:sv.color,indent:sv.indent,align:sv.align});
 }
 for(const c of cont.childNodes)walk(c);flush();return y;
}

/* ───────── Boot + migration ───────── */
async function runMigration(seed){
 try{
  const p=newProjectObj(seed.project);
  // overlay seed sections (text + any custom)
  if(Array.isArray(seed.project.sections)){
   for(const ss of seed.project.sections){let tgt=p.sections.find(s=>s.id===ss.id);
    if(!tgt){tgt={id:ss.id,name:ss.name||ss.id,description:ss.description||'',required:!!ss.required,text:'',documents:[]};p.sections.push(tgt);}
    if(typeof ss.text==='string')tgt.text=ss.text;if(ss.name)tgt.name=ss.name;if(ss.description!=null)tgt.description=ss.description;if(typeof ss.required==='boolean')tgt.required=ss.required;}
  }
  for(const f of (seed.files||[])){
   const blob=b64ToBlob(f.b64,f.type||'application/pdf');const fileId=genId();const now=new Date().toISOString();
   await idbPut('files',{fileId,projectId:p.id,sectionId:f.sectionId,name:f.name,type:f.type||'application/pdf',size:f.size||blob.size,blob,uploadedAt:now,notes:f.notes||''});
   const sec=p.sections.find(s=>s.id===f.sectionId);if(sec)sec.documents.push({fileId,name:f.name,size:f.size||blob.size,type:f.type||'application/pdf',uploadedAt:now,notes:f.notes||''});
  }
  await idbPut('projects',p);await metaSet('currentProjectId',p.id);await metaSet('migrated',true);
  return p.id;
 }catch(e){console.error('migration failed',e);return null;}
}
async function boot(){
 document.getElementById('ver').textContent='v'+APP_VERSION+' · '+APP_BUILD;
 try{const bl=document.getElementById('brandLogo');if(bl)bl.src=LOGO;}catch(e){}
 try{await openDB();}catch(e){document.getElementById('view').innerHTML='<div class="empty"><div class="ic">⚠️</div><h3>Storage unavailable</h3><p>This browser blocked local database access. If you opened the file directly, try Safari or Chrome, or use a private-window-free normal window.</p></div>';return;}
 const migrated=await metaGet('migrated');
 projects=await idbAll('projects');
 if(projects.length===0&&!migrated&&window.OM_SEED){
  await runMigration(window.OM_SEED);projects=await idbAll('projects');
 }
 currentProjectId=await metaGet('currentProjectId');
 if(!currentProjectId||!projects.find(p=>p.id===currentProjectId))currentProjectId=projects[0]?projects[0].id:null;
 go(projects.length?'overview':'projects');
}
document.addEventListener('keydown',e=>{if(e.key==='Escape'){const pv=document.getElementById('pv');if(pv.classList.contains('on'))closePv();else closeModal();}});
boot();
</script>
