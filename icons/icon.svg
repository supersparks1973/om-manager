<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F766E"/>
      <stop offset="1" stop-color="#064E47"/>
    </linearGradient>
    <linearGradient id="cover" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E3ECEA"/>
    </linearGradient>
    <linearGradient id="badge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFC94A"/>
      <stop offset="1" stop-color="#F29F05"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="1024" height="1024" fill="url(#bg)"/>

  <!-- binder shadow -->
  <rect x="248" y="182" width="476" height="640" rx="40" fill="#000" opacity="0.28"/>
  <!-- binder spine -->
  <rect x="226" y="164" width="120" height="640" rx="36" fill="#134E4A"/>
  <!-- binder cover -->
  <rect x="290" y="164" width="420" height="640" rx="32" fill="url(#cover)"/>
  <!-- rings -->
  <g fill="none" stroke="#94A3B8" stroke-width="18" stroke-linecap="round">
    <path d="M262 290 h60"/><path d="M262 484 h60"/><path d="M262 678 h60"/>
  </g>
  <!-- label panel -->
  <rect x="340" y="234" width="320" height="150" rx="18" fill="#0F766E"/>
  <text x="500" y="338" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-weight="bold" font-size="104" fill="#FFFFFF">O&amp;M</text>
  <!-- content lines -->
  <g fill="#A7BDB9">
    <rect x="350" y="430" width="250" height="24" rx="12"/>
    <rect x="350" y="486" width="200" height="24" rx="12"/>
    <rect x="350" y="542" width="230" height="24" rx="12"/>
  </g>

  <!-- spanner badge -->
  <circle cx="702" cy="712" r="150" fill="#000" opacity="0.25"/>
  <circle cx="692" cy="698" r="150" fill="url(#badge)" stroke="#FFFFFF" stroke-width="14"/>
  <g transform="translate(692 698) rotate(-45)">
    <rect x="-16" y="-20" width="32" height="130" rx="14" fill="#064E47"/>
    <path d="M -58 -60 a 62 62 0 1 0 116 0 l -32 0 l 0 40 l -52 0 l 0 -40 z" fill="#064E47"/>
  </g>
</svg>
